spring.application.name=tutormatch
server.port=${PORT:8080}

# Variables locales opcionales (DB_PASSWORD, FRONTEND_URL). Archivo ignorado por git.
spring.config.import=optional:file:.env[.properties]

# Base de datos por defecto: H2 en memoria
spring.datasource.url=jdbc:h2:mem:tutormatch;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate: crea la tabla "tutores" a partir de TutorEntity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.jackson.mapper.accept-case-insensitive-enums=true

# Pesos del score de afinidad (deben sumar 1.0)
matching.pesos.horario=0.40
matching.pesos.nivel=0.30
matching.pesos.calificacion=0.20
matching.pesos.modalidad=0.10

# Actuator: solo health
management.endpoints.web.exposure.include=health

springdoc.swagger-ui.path=/swagger-ui.html
logging.level.com.hackathon.tutormatch=INFO

# Perfil opcional: PostgreSQL en Supabase (datos persistentes).
# Activar con SPRING_PROFILES_ACTIVE=supabase y definir DB_PASSWORD.
# (Spring exige que las lineas pegadas a "#---" no sean comentarios)
management.endpoint.health.show-details=never
#---
spring.config.activate.on-profile=supabase
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USER:postgres.macrxelmeannitqegqzt}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.h2.console.enabled=false
# Hibernate crea/actualiza la tabla sin borrar los datos
spring.jpa.hibernate.ddl-auto=update
